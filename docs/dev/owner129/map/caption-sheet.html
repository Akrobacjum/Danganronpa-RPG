<!doctype html><html><head><meta charset="utf-8"><title>Token captions</title>
<link rel="stylesheet" href="/styles/base.css"><link rel="stylesheet" href="/styles/motion.css">
<link rel="stylesheet" href="/styles/danganronpa.css"><link rel="stylesheet" href="/styles/stained-glass.css">
<link rel="stylesheet" href="/styles/pixel-icons.css"><link rel="stylesheet" href="/styles/components.css">
<link rel="stylesheet" href="/styles/narrow.css">
<style>
/* A stand-in board (no Foundry here): a floor, a grid and four tokens. The labels are the module's own element and CSS. */
html,body{margin:0;height:100%;overflow:hidden}
#board{position:fixed;inset:0;background:#2b2620;background-image:linear-gradient(#0000 calc(100% - 1px),#ffffff14 0),linear-gradient(90deg,#0000 calc(100% - 1px),#ffffff14 0);background-size:var(--g) var(--g)}
.tok{position:absolute;width:var(--g);height:var(--g)}
.tok img{width:100%;height:100%;display:block}
.tint{width:100%;height:100%;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat;background:var(--t)}
#cap{position:fixed;left:16px;bottom:12px;right:16px;color:#ddd;font:14px/1.4 sans-serif;text-shadow:0 1px 2px #000}
</style></head><body>
<div id="board"></div><div id="cap"></div>
<script>
const q = new URLSearchParams(location.search);
// As settings.mjs `applyTheme` sets the body: the theme's class, and under Legacy the pixel face (its setting, on by default).
document.body.classList.add(q.get("theme") === "stained" ? "drpg-theme-stained-glass" : "drpg-theme-monokuma-legacy");
if (q.get("theme") !== "stained") document.body.classList.add("drpg-pixel-font");
const g = +(q.get("g") || 100); document.documentElement.style.setProperty("--g", g + "px");
const pl = q.get("lang") === "pl";
const T = pl
  ? { remnant: "Wyrwana kartka", project: "Barykada", cap: "S0-HOVERNAME B (1.2.128, E129), podpisy wlaczone - widok gracza. Plansza zastepcza, nie Foundry; podpisy rysowane wartosciami stylu z drawCaption (krój, kolor i obrys z CSS motywu). Od lewej: postac, zamaskowany zabojca (\"?\"), Remnant z wlasnym Truth Bulletem gracza, projekt widoczny dla gracza." }
  : { remnant: "Torn page", project: "Barricade", cap: "S0-HOVERNAME B (1.2.128, E129), captions on - a player's view. A stand-in board, not Foundry; the captions are drawn with drawCaption's style values (the theme's face, colour and keyline from its CSS). Left to right: a character, a masked killer (\"?\"), a Remnant with the player's own Truth Bullet, a project the player sees." };
document.getElementById("cap").textContent = T.cap;
const toks = [
  { img: "/icons/portrait-none.svg", name: "Aoi Kirigaya" },
  { img: "/icons/mask-unknown.svg", name: "?" },
  { mask: "/icons/remnant-search.svg", tint: "#8a8a8a", name: T.remnant, alpha: 0.5 },
  { mask: "/icons/project-barrier.svg", tint: "#d8c8a0", name: T.project, size: 2 }
];
const W = innerWidth, top0 = Math.round(innerHeight * 0.42);
// The caption's face as hover-name.mjs `captionStyle` reads it: a probe `.drpg-hover-name`, its computed font, colour, ground.
const probe = document.createElement("div"); probe.className = "drpg-hover-name"; probe.style.visibility = "hidden"; document.body.append(probe);
const cs = getComputedStyle(probe); const face = { family: cs.fontFamily, fill: cs.color, stroke: cs.backgroundColor }; probe.remove();
const rgb = c => { const m = /rgba?\(\s*(\d+)[\s,]+(\d+)[\s,]+(\d+)/.exec(c); return m ? `rgb(${m[1]}, ${m[2]}, ${m[3]})` : c; };
const board = document.getElementById("board");
document.fonts.load(`16px ${face.family}`).then(() => toks.forEach((t, i) => {
  const size = (t.size || 1) * g, x = Math.round(W * (0.16 + i * 0.22)), y = top0 - (t.size === 2 ? g / 2 : 0);
  const el = document.createElement("div"); el.className = "tok";
  el.style.cssText = `left:${x - size / 2}px;top:${y}px;width:${size}px;height:${size}px;opacity:${t.alpha ?? 1}`;
  el.innerHTML = t.img ? `<img src="${t.img}">` : `<div class="tint" style="--u:url(${t.mask});--t:${t.tint}"></div>`;
  board.append(el);
  // As hover-name.mjs `drawCaption` draws it with PIXI.Text (a 2D canvas: the keyline stroked, then the words filled):
  // The face loaded first, as captionStyle asks for it. The caption is a child of the token, not of its picture: the
  // Remnant's 0.5 (REMNANT_ALPHA.player, on the mesh) does not fade it.
  // fontSize max(14, grid * 0.2), strokeThickness max(3, grid * 0.05), anchored at its top centre, grid * 0.04 under the token.
  const fs = Math.max(14, Math.round(g * 0.2)), sw = Math.max(3, Math.round(g * 0.05));
  const c = document.createElement("canvas"), ctx = c.getContext("2d"), dpr = devicePixelRatio || 1;
  ctx.font = `${fs}px ${face.family}`; const tw = Math.ceil(ctx.measureText(t.name).width) + sw * 2, th = Math.ceil(fs * 1.3) + sw;
  c.width = tw * dpr; c.height = th * dpr; c.style.cssText = `position:absolute;width:${tw}px;height:${th}px;left:${x - tw / 2}px;top:${y + size + Math.round(g * 0.04)}px`;
  ctx.scale(dpr, dpr); ctx.font = `${fs}px ${face.family}`; ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.lineJoin = "round";
  ctx.lineWidth = sw; ctx.strokeStyle = rgb(face.stroke); ctx.strokeText(t.name, tw / 2, sw / 2);
  ctx.fillStyle = rgb(face.fill); ctx.fillText(t.name, tw / 2, sw / 2);
  board.append(c);
}));

</script></body></html>
