<!doctype html><html><head><meta charset="utf-8"><title>Hover name</title>
<link rel="stylesheet" href="/styles/base.css"><link rel="stylesheet" href="/styles/motion.css">
<link rel="stylesheet" href="/styles/danganronpa.css"><link rel="stylesheet" href="/styles/stained-glass.css">
<link rel="stylesheet" href="/styles/pixel-icons.css"><link rel="stylesheet" href="/styles/components.css">
<link rel="stylesheet" href="/styles/narrow.css">
<style>
/* A stand-in board (no Foundry here): a floor, a grid and four tokens. The labels are the module's own element and CSS. */
html,body{margin:0;height:100%;overflow:hidden}
#board{position:fixed;inset:0;background:#2b2620;background-image:linear-gradient(#0000 calc(100% - 1px),#ffffff14 0),linear-gradient(90deg,#0000 calc(100% - 1px),#ffffff14 0);background-size:var(--g) var(--g)}
.tok{position:absolute;width:var(--g);height:var(--g)}
.tok img{width:100%;height:100%;display:block}
.tint{width:100%;height:100%;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat;background:var(--t)}
#cap{position:fixed;left:16px;bottom:12px;right:16px;color:#ddd;font:14px/1.4 sans-serif;text-shadow:0 1px 2px #000}
</style></head><body>
<div id="board"></div><div id="cap"></div>
<script>
const q = new URLSearchParams(location.search);
// As settings.mjs `applyTheme` sets the body: the theme's class, and under Legacy the pixel face (its setting, on by default).
document.body.classList.add(q.get("theme") === "stained" ? "drpg-theme-stained-glass" : "drpg-theme-monokuma-legacy");
if (q.get("theme") !== "stained") document.body.classList.add("drpg-pixel-font");
const g = +(q.get("g") || 100); document.documentElement.style.setProperty("--g", g + "px");
const pl = q.get("lang") === "pl";
const T = pl
  ? { remnant: "Wyrwana kartka", project: "Barykada", cap: "S0-HOVERNAME (1.2.128, E129) - widok gracza. Plansza zastepcza, nie Foundry; etykiety to element modulu .drpg-hover-name z jego CSS. W grze naraz jest jedna. Od lewej: postac, zamaskowany zabojca (\"?\"), Remnant z wlasnym Truth Bulletem gracza, projekt widoczny dla gracza." }
  : { remnant: "Torn page", project: "Barricade", cap: "S0-HOVERNAME (1.2.128, E129) - a player's view. A stand-in board, not Foundry; the labels are the module's .drpg-hover-name element with its CSS. In play one shows at a time. Left to right: a character, a masked killer (\"?\"), a Remnant with the player's own Truth Bullet, a project the player sees." };
document.getElementById("cap").textContent = T.cap;
const toks = [
  { img: "/icons/portrait-none.svg", name: "Aoi Kirigaya" },
  { img: "/icons/mask-unknown.svg", name: "?" },
  { mask: "/icons/remnant-search.svg", tint: "#8a8a8a", name: T.remnant, alpha: 0.5 },
  { mask: "/icons/project-barrier.svg", tint: "#d8c8a0", name: T.project, size: 2 }
];
const W = innerWidth, top0 = Math.round(innerHeight * 0.42);
toks.forEach((t, i) => {
  const size = (t.size || 1) * g, x = Math.round(W * (0.16 + i * 0.22)), y = top0 - (t.size === 2 ? g / 2 : 0);
  const el = document.createElement("div"); el.className = "tok";
  el.style.cssText = `left:${x - size / 2}px;top:${y}px;width:${size}px;height:${size}px;opacity:${t.alpha ?? 1}`;
  el.innerHTML = t.img ? `<img src="${t.img}">` : `<div class="tint" style="--u:url(${t.mask});--t:${t.tint}"></div>`;
  document.getElementById("board").append(el);
  // As hover-name.mjs showHoverName builds it: class, aria-hidden, textContent, left and top at the token's top centre.
  const label = document.createElement("div");
  label.className = "drpg-hover-name"; label.setAttribute("aria-hidden", "true"); label.textContent = t.name;
  label.style.left = `${x}px`; label.style.top = `${y}px`;
  document.body.append(label);
});
</script></body></html>
