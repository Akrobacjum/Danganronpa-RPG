<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hide notice shots</title>
<!-- S0-HIDE (1.2.128, 23.11.2026): the card a hide's end at the time of day sends its player, as
     audit/harness/probes/129-hide-notice.mjs kept it from p1's page (notice/capture/notice-<en|pl>.html), drawn in a chat
     column on the right under the module's sheets as module.json lists them - this page's ground, column and list stand
     in for Foundry's sidebar, whose own stylesheet is not here. Served from the repository's root, then
       /docs/dev/owner129/stg/notice/notice-shots.html?lang=en[&theme=legacy]
     Built on docs/dev/owner124/console/shots.html (its stylesheets and the Font Awesome note). -->
<link rel="stylesheet" href="/vendor-fa/css/all.min.css">
<style>
  /* The module's sheets ask for Foundry v14's family by name, "Font Awesome 7 Pro"; the free package calls its solid
     face "Font Awesome 6 Free". The name is lent to the free solid face here (the glyphs drawn are at the same code
     points), on this page only. */
  @font-face { font-family: "Font Awesome 7 Pro"; font-weight: 100 900; font-display: block; src: url("/vendor-fa/webfonts/fa-solid-900.woff2") format("woff2"); }
</style>
<script>
  (function () {
    var req = new XMLHttpRequest();
    req.open("GET", "/module.json", false);
    req.send();
    var styles = JSON.parse(req.responseText).styles || [];
    for (var i = 0; i < styles.length; i++) document.write('<link rel="stylesheet" href="/' + styles[i] + '">');
  })();
</script>
<style>
  html, body.drpg-owner-shot { background: #2a2430; margin: 0; height: 100vh; overflow: hidden; }
  .drpg-owner-shot #drpg-shot-chat { position: fixed; top: 0; right: 0; bottom: 0; width: 300px; padding: 8px; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: flex-end; background: rgba(0, 0, 0, 0.35); }
  .drpg-owner-shot #drpg-shot-chat ol { list-style: none; margin: 0; padding: 0; }
</style>
</head>
<body class="drpg-theme-stained-glass drpg-owner-shot" data-drpg-time="afternoon" data-drpg-phase="dailyLife">
<section id="drpg-shot-chat" class="sidebar-tab chat-sidebar"><ol id="chat-log" class="chat-log"></ol></section>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.get("theme") === "legacy") {
      document.body.classList.replace("drpg-theme-stained-glass", "drpg-theme-monokuma-legacy");
      document.body.classList.add("drpg-pixel-font");
    }
    var req = new XMLHttpRequest();
    req.open("GET", "capture/notice-" + (q.get("lang") === "pl" ? "pl" : "en") + ".html", false);
    req.send();
    document.getElementById("chat-log").innerHTML = req.status === 200 ? req.responseText : "<li>no capture</li>";
    document.body.setAttribute("data-drpg-shot-ready", "");
  })();
</script>
</body>
</html>
