# The 'ci' layer of the release gate (E30, decision D47): `npm test` in
# audit/harness, split into three jobs that run side by side. release.yml calls
# this file before it builds, so a release and a pull request meet the same steps.
#
# Measured 24.09.2026 in a 4-core container (audit/harness/run-all.mjs, one run
# of everything, 8m08s wall): lint 3.4 s, check 2.9 s, the suite 309.5 s, the
# other fourteen scenarios 171.7 s together (30-security 65.5 s of it). Peak
# memory: the suite's GM client 474 MB, every other client 217-232 MB, each
# cluster 58-63 MB, run-all 302 MB with ESLint loaded. Every results JSON
# records its time and each client's maxRSS, uploaded below.
#
# Measured on Actions (ubuntu-24.04), the "npm test" step of each job: 1.2.67
# (05.10.2026, run 15, 738 tests) the suite 17 min 56 s, the scenarios 11 min
# 59 s, lint-check-gate 11 s. 1.2.68 (06.10.2026, run 17, 863 tests) the suite
# ran into its 25-minute limit and was cancelled 25 min 2 s into the step, the
# scenarios took 16 min 11 s; the same suite on the same code took 1547.7 s in
# the 4-core container (k4 on 0fa68c3). The limits below are there to end a
# hang, not to budget a run: each is about twice the last green run of its job,
# and the suite grows with every stage of the 1.3.0 plan (309 s on 24.09, 1548 s
# on 06.10). 07.10.2026 (E33 part 1, 899 tests, the 4-core container, e33run/k1c):
# the suite 1702 s and its scenario 1993 s wall, beside two other harness lanes;
# run-all's own suite bound is 60 minutes since fix r1-G3, and the suite job's
# limit sits above it at 70 so that run-all's own verdict, not the runner's
# cancel, is what ends a hang.
#
# workflow_dispatch lets anyone with write access run it on any branch - the
# mutation branches of the E30 gate design among them. Making these jobs
# required for a merge is a branch-protection setting on GitHub, not this file.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "lint, check, gate", parts: "lint check gate", minutes: 10 }
          - { name: "suite", parts: "suite", minutes: 70 }
          - { name: "scenarios", parts: "scenarios", minutes: 40 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: audit/harness/package-lock.json
      - name: Install the harness
        working-directory: audit/harness
        # Playwright is a devDependency for the local gate's live runner, which
        # never runs here; 1.56.1 has no install script, and this keeps it so.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: npm test (${{ matrix.parts }})
        working-directory: audit/harness
        env:
          PARTS: ${{ matrix.parts }}
        run: node run-all.mjs $PARTS
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ strategy.job-index }}
          path: audit/harness/results/
          if-no-files-found: ignore
          retention-days: 14
