# .github/workflows/ci.yml (INFRA I3, 18.10.2026). The 'ci' layer of the release gate, as before
# (decision D47): lint, tools/check.mjs, the gate's self-test, the suite and every scenario whose layers include
# "ci" - now spread over parallel jobs so that one push is validated in roughly 10-15 minutes instead of today's
# 32-47 min (the longer of one suite job and one scenarios job, four PR runs at 1.2.71-1.2.77).
#
# Measured on the first four runs, 18.10.2026 (push to the last job's end; 18 jobs each, none queued):
#   run 39095288436 (3f9a835) 953 s, 39096431845 (8b120b5) 957 s, 39096979046 (9ff7fa2) 974 s - each red on suite
#   7/8 alone (a test's count read another test's trace digest, fixed in the test at 67d2ea7) - and 39099666858
#   (67d2ea7) 671 s, green. Suite 1/8 was the longest job every time (930, 932, 952, 647 s: it runs tiers 0-1 and
#   01-runtests' parts A and B beside its eighth of tier 2); the other shards 251-365 s, the scenario buckets
#   107-365 s, quick 36-56 s, verdict 10-12 s. Why suite 1/8 took 647 s on the fourth run and 930-952 s on the
#   first three is not measured.
#
# Jobs (17 at once on a push: quick, 8 buckets and 8 shards, after plan alone. 1.2.96's crlf dispatch, run 41330603959
# on 01.11.2026, the last with one crlf job, started 18 within 9 s. A crlf dispatch now starts crlf-quick in that first
# wave, 18 at once, and crlf-suite's 8 shards only when every bucket has ended (its needs), beside at most quick, the 8
# shards and crlf-quick: 18 at most by construction, not yet measured on a dispatch. The Free plan allows 20 concurrent
# jobs on standard runners, free for a public repository, and queues the rest):
#   plan       reads the ci scenarios off the source exactly as run-all.mjs does (LAYERS_RE) and deals them into
#              BUCKETS by weight, longest first - a scenario added by a stage is picked up with no edit here
#   quick      run-all.mjs lint check gate
#   scenarios  one job per bucket: run-all.mjs scenarios --only <name>, for each name of the bucket
#   suite      one job per shard: run-all.mjs suite with DRPG_SUITE_SHARD=i/N (INFRA I2: tests.mjs deals tier 2
#              by position over shards 2..N, 01-runtests.mjs runs tiers 0-1 and its parts A and B in shard 1 alone;
#              tier 2 was dealt over all N on the four runs below, and suite 1/8 was the last job on each)
#   verdict    after all of them: the shards' union is the whole suite, once (audit/harness/suite-merge.mjs, which
#              reads shards/results-suite-<i>/01-runtests.json), and on a crlf dispatch the crlf shards' union too
#              (crlf-shards/results-crlf-suite-<i>/); every job green, each crlf job green or skipped. The CRLF merge
#              is a step here rather than a crlf-verdict job: a run keeps one answer, verdict's (the job the PR's
#              check and the session's ci-status read), and such a job would be one more need of verdict anyway
#   crlf-quick only on a dispatch with crlf = true (once per train, before its PR; decision D198 (2), 01.11.2026,
#              METHOD.md section 9 item 1): run-all.mjs lint check gate on a checkout with Windows line ends
#              (core.autocrlf true), as a Windows GM's copy reads
#   crlf-suite the same dispatch: suite's shards, DRPG_SUITE_SHARD=i/8, on that CRLF checkout, after every scenarios
#              bucket (the job count above). From 1.2.96's dispatch (the buckets ended by 448 s, suite 1/8 took
#              1108 s) the last crlf shard was estimated to end about 26-27 minutes after plan; measured on the
#              first dispatch, 02.11.2026 (run 41377151746, 2b5527e1): 1509 s from the first job's start to the last
#              job's end, 28 jobs (crlf suite 1/8 1008 s, the other shards 432-509 s, crlf lint, check, gate 119 s);
#              2699 s from the dispatch to the run's end, queued behind the push run of the same commit.
#              No scenarios run on CRLF: the single-process run's three finds were tier 0-1 tests reading source text
#              (shard 1 runs tiers 0-1), E16-T24's order dependence, which only one process running tier 2 after
#              01-runtests' parts A and B shows, and the clock-bus race the push run found too (METHOD.md's Lessons,
#              20.10, 26.10 and 26-27.10). That single-process run is .github/workflows/crlf-whole.yml since E37 C8:
#              weekly and before 1.3.0, non-blocking; neither this file nor release.yml calls it.
#
# Triggers: a push to main or to a line branch (claude/**), a dispatch, and release.yml's call. No pull_request
# trigger: a PR from a line branch would run every job twice on the same commit (34 jobs against the plan's 20).
# Branch protection matches a required check by name on the PR's head commit, so the push run's "verdict" is the one
# the PR waits for; INFRA I3 checks this on the first PR (not measured when this file landed).
#
# The line's session cannot read job logs or artifacts (their blob host is refused), so a red job also writes its
# first problems as error annotations, which the API serves (the session's ci-status.sh prints them; it is not in
# this repository).
#
# The suite job's limit stays 115 minutes, above run-all.mjs's own 108-minute bound on the suite (its comment says
# why), so that a hung shard is ended by run-all, whose verdict names the test, rather than by the runner's cancel;
# crlf-suite's is the same 115. crlf-whole.yml's job keeps the 200 the single crlf job had.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      crlf:
        description: "Also run lint, check, gate and the suite in shards on a CRLF checkout (once per train, before its PR)"
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

# One run per commit; a newer push does not cancel an older run (every pushed commit keeps its verdict).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.2
  BUCKETS: 8
  SHARDS: 8
  # Prints what went red, one a line (read by the "name the failures" steps below): first each suite test that failed
  # (results/01-runtests.json's evidence.suite.results) and each scenario check that failed (results/<scenario>.json's
  # results), with its message; then the problems of results/run-all.json's red parts. The suite and the checks come
  # first because run-all's problems name only the check ("FAIL gm: suite failures") - CI run 39095288436 on 18.10.2026
  # went red on shard 7 with that line alone, and the test that failed could not be read from the session.
  # Red parts only: run-all's check and gate parts keep the lines of a green run that mention "problem" or "missing"
  # too ("dashes: ... 0 problem(s)"), which would fill the ten annotations before the real one.
  NAME_FAILS: >-
    const fs = require("fs"); const one = s => String(s).replace(/[\r\n]+/g, " ").replace(/%/g, "%25").slice(0, 300);
    for (const f of (fs.existsSync("results") ? fs.readdirSync("results") : []).filter(f => /^\d\d-.*\.json$/.test(f))) {
    let s = null; try { s = JSON.parse(fs.readFileSync("results/" + f, "utf8")); } catch { continue; }
    for (const t of (s.evidence?.suite?.results || [])) if (t.outcome === "fail") console.log(one("test " + t.name + ": " + (t.message || "")));
    for (const c of (s.results || [])) if (c.status === "fail") console.log(one(f.replace(/\.json$/, "") + " " + c.name + ": " + (c.details || ""))); }
    const j = JSON.parse(fs.readFileSync("results/run-all.json", "utf8"));
    for (const r of j.parts) if (r.status === "red") for (const p of (r.problems || []))
    console.log(r.part + ": " + one(p));

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      buckets: ${{ steps.plan.outputs.buckets }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Deal the ci scenarios into buckets
        # Weights in seconds from the k-chain logs of E77-E79 (61 ~300, 30 ~285, 83 ~158, 41 ~149, 66 ~111, 74 ~68,
        # 76 ~60, 73 ~34, 75 ~9); every other scenario counts 60 until measured. Re-read them from
        # results/<scenario>.json after the first runs.
        run: |
          node -e '
            const fs = require("fs"), dir = "audit/harness/scenarios";
            const RE = /export const layers = (\[[^\]]*\])/;
            const W = { "61-gmstore-case": 300, "30-security": 285, "83-roll-integrity": 158, "41-trial-scene": 149,
                        "66-rooms": 111, "74-room-tile": 68, "76-passages": 60, "73-notice-history": 34, "75-voice-tile": 9 };
            const names = fs.readdirSync(dir).filter(f => /^\d{2}-.+\.mjs$/.test(f)).sort().filter(f => {
              const m = fs.readFileSync(dir + "/" + f, "utf8").match(RE);
              try { return !!m && JSON.parse(m[1]).includes("ci"); } catch { return false; }
            }).map(f => f.replace(/\.mjs$/, "")).filter(n => n !== "01-runtests");
            const k = Math.max(1, Math.min(Number(process.env.BUCKETS), names.length));
            const b = Array.from({ length: k }, (_, i) => ({ name: "b" + (i + 1), list: [], w: 0 }));
            for (const n of [...names].sort((x, y) => (W[y] ?? 60) - (W[x] ?? 60))) {
              const t = b.reduce((m, x) => (x.w < m.w ? x : m)); t.list.push(n); t.w += W[n] ?? 60;
            }
            const buckets = b.filter(x => x.list.length).map(x => ({ name: x.name, list: x.list.join(" "), w: x.w }));
            const shards = Array.from({ length: Number(process.env.SHARDS) }, (_, i) => i + 1);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "buckets=" + JSON.stringify(buckets) + "\nshards=" + JSON.stringify(shards) + "\n");
            console.log(names.length + " ci scenarios in " + buckets.length + " buckets:");
            for (const x of buckets) console.log("  " + x.name + " (~" + x.w + " s): " + x.list);
          '

  quick:
    name: lint, check, gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: audit/harness/package-lock.json }
      - name: Install the harness
        working-directory: audit/harness
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
        run: npm ci
      - name: run-all lint check gate
        working-directory: audit/harness
        run: |
          node run-all.mjs lint check gate && exit 0
          (node -e "$NAME_FAILS" || echo "results/run-all.json is missing") | head -10 | sed 's/^/::error title=lint check gate::/'
          exit 1

  scenarios:
    needs: plan
    name: scenarios ${{ matrix.bucket.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bucket: ${{ fromJSON(needs.plan.outputs.buckets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: audit/harness/package-lock.json }
      - name: Install the harness
        working-directory: audit/harness
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
        run: npm ci
      - name: ${{ matrix.bucket.list }}
        working-directory: audit/harness
        env: { LIST: "${{ matrix.bucket.list }}" }
        run: |
          rc=0; : > problems.txt
          for s in $LIST; do
            node run-all.mjs scenarios --only "$s" && continue
            rc=1; (node -e "$NAME_FAILS" || echo "$s: results/run-all.json is missing") >> problems.txt
          done
          head -10 problems.txt | sed 's/^/::error title=scenarios::/'
          exit $rc
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: "results-scen-${{ matrix.bucket.name }}", path: audit/harness/results/, if-no-files-found: ignore, retention-days: 14 }

  suite:
    needs: plan
    name: suite ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: audit/harness/package-lock.json }
      - name: Install the harness
        working-directory: audit/harness
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
        run: npm ci
      - name: run-all suite (shard ${{ matrix.shard }})
        working-directory: audit/harness
        env: { DRPG_SUITE_SHARD: "${{ matrix.shard }}/${{ env.SHARDS }}" }
        run: |
          node run-all.mjs suite && exit 0
          (node -e "$NAME_FAILS" || echo "results/run-all.json is missing") | head -10 | sed 's/^/::error title=suite ${{ matrix.shard }}::/'
          exit 1
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: "results-suite-${{ matrix.shard }}", path: audit/harness/results/, if-no-files-found: ignore, retention-days: 14 }

  crlf-quick:
    if: github.event_name == 'workflow_dispatch' && inputs.crlf
    name: crlf lint, check, gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Windows line ends for the checkout below
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - name: The tree really has CRLF line ends
        run: grep -c $'\r$' README.md | grep -qv '^0$'
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: audit/harness/package-lock.json }
      - name: Install the harness
        working-directory: audit/harness
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
        run: npm ci
      - name: run-all lint check gate on the CRLF tree
        working-directory: audit/harness
        run: |
          node run-all.mjs lint check gate && exit 0
          (node -e "$NAME_FAILS" || echo "results/run-all.json is missing") | head -10 | sed 's/^/::error title=crlf lint check gate::/'
          exit 1

  crlf-suite:
    # After every scenarios bucket, whatever their result, so that a crlf dispatch stays under 20 jobs at once (the
    # header); !cancelled() lets a red bucket through, and plan's shards must exist for the matrix.
    needs: [plan, scenarios]
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.crlf }}
    name: crlf suite ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Windows line ends for the checkout below
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - name: The tree really has CRLF line ends
        run: grep -c $'\r$' README.md | grep -qv '^0$'
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: audit/harness/package-lock.json }
      - name: Install the harness
        working-directory: audit/harness
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
        run: npm ci
      - name: run-all suite on the CRLF tree (shard ${{ matrix.shard }})
        working-directory: audit/harness
        env: { DRPG_SUITE_SHARD: "${{ matrix.shard }}/${{ env.SHARDS }}" }
        run: |
          node run-all.mjs suite && exit 0
          (node -e "$NAME_FAILS" || echo "results/run-all.json is missing") | head -10 | sed 's/^/::error title=crlf suite ${{ matrix.shard }}::/'
          exit 1
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: "results-crlf-suite-${{ matrix.shard }}", path: audit/harness/results/, if-no-files-found: ignore, retention-days: 14 }

  verdict:
    needs: [quick, scenarios, suite, crlf-quick, crlf-suite]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/download-artifact@v4
        with: { pattern: "results-suite-*", path: shards }
      - name: The shards together are the whole suite (INFRA I2)
        run: node audit/harness/suite-merge.mjs shards
      # Only when crlf-suite ran: skipped on a push and in release.yml's call, where no crlf job runs. !cancelled()
      # reads the CRLF shards even when the step above went red, so that one run names both.
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() && needs.crlf-suite.result != 'skipped' }}
        with: { pattern: "results-crlf-suite-*", path: crlf-shards }
      - name: The CRLF shards together are the whole suite (D198)
        if: ${{ !cancelled() && needs.crlf-suite.result != 'skipped' }}
        run: node audit/harness/suite-merge.mjs crlf-shards
      - name: Every job green
        env:
          QUICK: ${{ needs.quick.result }}
          SCEN: ${{ needs.scenarios.result }}
          SUITE: ${{ needs.suite.result }}
          CRLFQ: ${{ needs.crlf-quick.result }}
          CRLFS: ${{ needs.crlf-suite.result }}
        run: |
          echo "quick $QUICK, scenarios $SCEN, suite $SUITE, crlf-quick $CRLFQ, crlf-suite $CRLFS"
          ok() { [ "$1" = success ] || [ "$1" = skipped ]; }
          [ "$QUICK" = success ] && [ "$SCEN" = success ] && [ "$SUITE" = success ] && ok "$CRLFQ" && ok "$CRLFS"
