# Publish a release from the current state of `main`.
#
# Why a workflow at all: the module is built with `git archive`, so the package
# is a pure function of the tree - anything with a checkout can build the same
# zip byte for byte. Running it here means a release is one button, the tag is
# created server-side at the exact commit that built the package, and nothing
# depends on whichever machine happened to cut it.
#
# WHAT CHANGED FOR THE 1.3.0 PLAN (E01, 24.09.2026). The plan ships every stage
# as the next 1.2.X and the last one as 1.3.0 "Stained Update" (decision D20),
# so this file is used a dozen times in a row rather than once, and four of its
# defects would have been paid for at every one of them (audit S14-27):
#
#   - the tag defaulted to "v1.2.0", so a dispatch with the field left alone
#     asked for a release that already exists; it has no default now;
#   - the release was titled with the bare tag, so 1.3.0 could only ever be
#     "v1.3.0"; there is a title input now, and an empty one still means the tag;
#   - nothing stopped a dispatch from another branch, and CLAUDE.md says `main`
#     is the release branch; the first step refuses anything else;
#   - the `module.json` published with a release said `releases/latest/...` for
#     its download, so installing an OLDER release by its manifest fetched the
#     NEWEST zip. The published copy now names its own tag's zip. The committed
#     file keeps `latest`, which is right for it: it is what a fresh install and
#     the update check read.
#
# The cleanup of the v1.1.X prereleases is gone with its input: those tags are
# no longer on the remote, so it could only ever report "skipped" 88 times.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.2.57 - must match module.json"
        required: true
      title:
        description: "Release title; empty means the tag. The last stage: v1.3.0 - Stained Update"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything but main
        # `main` is the release branch (CLAUDE.md, Releasing). A release cut from
        # a working branch tags a commit `main` may never contain, and the next
        # release from `main` quietly drops whatever that one shipped.
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "releases are cut from main; this was dispatched on ${GITHUB_REF}" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check the manifest matches the tag
        run: |
          manifest="$(python3 -c "import json; print(json.load(open('module.json'))['version'])")"
          wanted="${{ inputs.tag }}"
          if [ "v$manifest" != "$wanted" ]; then
            echo "module.json says $manifest but the tag asked for is $wanted" >&2
            exit 1
          fi

      - name: Check the stylesheet stamp and the notes
        # `--drpg-css-version` is read back at load by diagnostics.mjs to catch a
        # stale CDN copy of the stylesheet; a release whose stamp lags the manifest
        # reports every fresh client as stale. The 1.2.42 package shipped that way.
        run: |
          manifest="$(python3 -c "import json; print(json.load(open('module.json'))['version'])")"
          stamp="$(sed -n 's/.*--drpg-css-version: *"\([^"]*\)".*/\1/p' styles/danganronpa.css | head -1)"
          if [ "$stamp" != "$manifest" ]; then
            echo "styles/danganronpa.css stamps --drpg-css-version \"$stamp\" but module.json says $manifest" >&2
            exit 1
          fi
          if [ ! -f ".github/release-notes/${{ inputs.tag }}.md" ]; then
            echo "no release notes at .github/release-notes/${{ inputs.tag }}.md" >&2
            exit 1
          fi

      - name: Check the README and the handbooks name this version
        # The handbooks open from the corner of the screen and say which version
        # they describe on their third line; the README says it once. All seven
        # said 1.2.55 while the module was 1.2.56, and the sandbox showed the
        # brochure reading "Module 1.2.55" to a player (audit S14-16, S13-42,
        # S12-76). With a release per stage that gap would open at every one, so
        # it is checked here, next to the stylesheet stamp, and by R125 in the
        # suite. The handbook stamp is looked for in the first five lines only:
        # a version quoted further down is history, not a stamp.
        run: |
          manifest="$(python3 -c "import json; print(json.load(open('module.json'))['version'])")"
          bad=0
          for f in docs/handbooks/gm-handbook.en.md docs/handbooks/gm-handbook.pl.md \
                   docs/handbooks/player-handbook.en.md docs/handbooks/player-handbook.pl.md \
                   docs/handbooks/player-brochure.en.md docs/handbooks/player-brochure.pl.md; do
            if ! head -5 "$f" | grep -qF "$manifest"; then
              echo "$f does not name version $manifest in its header" >&2
              bad=1
            fi
          done
          if ! grep -qF "describe version $manifest." README.md; then
            echo "README.md does not say the handbooks describe version $manifest" >&2
            bad=1
          fi
          exit $bad

      - name: Build the package
        run: git archive --format=zip -o module.zip HEAD

      - name: Point the published manifest at this release's own zip
        # Only the copy uploaded next to the zip changes; the zip itself carries
        # the committed module.json, whose `latest` URLs are what an install and
        # the update check should read.
        run: |
          python3 - "${{ inputs.tag }}" "${{ github.repository }}" <<'PY'
          import json, sys
          tag, repo = sys.argv[1], sys.argv[2]
          with open("module.json", encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["download"] = f"https://github.com/{repo}/releases/download/{tag}/module.zip"
          with open("module.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print("download ->", manifest["download"])
          PY

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
        run: |
          title="${TITLE:-${{ inputs.tag }}}"
          gh release create "${{ inputs.tag }}" module.zip module.json \
            -R "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$title" \
            --notes-file ".github/release-notes/${{ inputs.tag }}.md" \
            --latest

      - name: Show what latest resolves to
        env:
          GH_TOKEN: ${{ github.token }}
        # No --json: the runner's gh does not know every field name, and a
        # verification step that can fail on a field name fails the whole run
        # AFTER the release is already out - which is exactly what happened on
        # run 1. Plain view cannot. A mismatch is printed as a warning rather than
        # failing, for the same reason: the release exists by now, and what is
        # wanted is somebody looking at it (a new prerelease can move `latest`).
        run: |
          view="$(gh release view -R "${{ github.repository }}" | head -5)"
          echo "$view"
          if ! printf '%s\n' "$view" | grep -qF "${{ inputs.tag }}"; then
            echo "::warning::releases/latest does not resolve to ${{ inputs.tag }} - check the Releases page"
          fi
