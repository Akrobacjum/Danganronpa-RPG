# Publish a release from the current state of `main`.
#
# Why a workflow at all: the module is built with `git archive`, so the package
# is a pure function of the tree - anything with a checkout can build the same
# zip byte for byte. Running it here means a release is one button, the tag is
# created server-side at the exact commit that built the package, and nothing
# depends on whichever machine happened to cut it.
#
# WHAT CHANGED FOR THE 1.3.0 PLAN (E01, 24.09.2026). The plan ships every stage
# as the next 1.2.X and the last one as 1.3.0 "Stained Update" (decision D20),
# so this file is used a dozen times in a row rather than once, and four of its
# defects would have been paid for at every one of them (audit S14-27):
#
#   - the tag defaulted to "v1.2.0", so a dispatch with the field left alone
#     asked for a release that already exists; it has no default now;
#   - the release was titled with the bare tag, so 1.3.0 could only ever be
#     "v1.3.0"; there is a title input now, and an empty one still means the tag;
#   - nothing stopped a dispatch from another branch, and CLAUDE.md says `main`
#     is the release branch; the first step refuses anything else;
#   - the `module.json` published with a release said `releases/latest/...` for
#     its download, so installing an OLDER release by its manifest fetched the
#     NEWEST zip. The published copy now names its own tag's zip. The committed
#     file keeps `latest`, which is right for it: it is what a fresh install and
#     the update check read.
#
# The cleanup of the v1.1.X prereleases is gone with its input: those tags are
# no longer on the remote, so it could only ever report "skipped" 88 times.
# WHAT CHANGED FOR THE TWO-LAYER GATE (E30, decision D47, 24.09.2026). A release
# now meets both layers before anything is built:
#
#   - ci: ci.yml, called on the same commit - lint, tools/check.mjs, the gate's
#     self-test, the suite and the ci scenarios, exactly what a pull request met;
#   - local-gate: audit/gate/verify-gate.mjs reads audit/gate/local-gate.json,
#     which only audit/gate/local-gate.mjs writes, on a machine with a Foundry v14
#     sandbox; its rules are listed at the top of that file. The repository
#     variable DRPG_LOCAL_GATE picks what a required part that did not run means:
#     "record" (unset) lets a waivable one through with the release notes'
#     "- Not checked in a real Foundry" line, as debt in the summary; "enforce"
#     wants the owner's waiver file, this workflow's local_gate_waiver input and
#     an approval in the protected environment local-gate-waiver (the
#     waiver-approval job). 1.3.0 is refused in either mode without a passed gate.
#
# The three shell steps that checked the manifest, the stylesheet stamp, the
# handbooks and the notes are `node tools/check.mjs stamps notes --release`
# now, which `npm test` also runs (R125 checks the same stamps in the suite).
# New steps take the inputs through env: rather than ${{ }} inside a script;
# the older build and publish steps still interpolate the tag, which by then
# check.mjs has refused unless it reads vX.Y.Z.
#
# WHAT CHANGED FOR TRAINS (INFRA I10, 18.10.2026; the owner's O1 of 15.10: a
# release is a train of several stages, D20 retired). A train is published as a
# prerelease, the owner plays it at a table, and only then is it made latest:
#
#   - `prerelease`: the same gates and the same build, published with
#     --prerelease instead of --latest; the check after it expects
#     releases/latest to be what it was before the run, read just before;
#   - `promote`: a job of its own - no gate, no build, no asset - that edits the
#     release that is there to `--prerelease=false --latest`, after refusing a
#     tag that is not a prerelease (promoting an older full release would move
#     latest backwards), and then the same check, expecting the tag;
#   - both at once is refused in the first job, so nothing else starts.
#
# The gates are not run again for a promote: they ran on that tag's commit when
# it was published, and the release's assets are not touched. The plain
# `gh release view` lines both modes read (tag:, prerelease:) are its non-TTY
# output; that a runner prints them so is to be seen on the first train.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.2.57 - must match module.json"
        required: true
      title:
        description: "Release title; empty means the tag. The last stage: v1.3.0 - Stained Update"
        required: false
        default: ""
      local_gate_waiver:
        description: "Leave empty. Only with a waiver the owner wrote (enforce mode): the tag again. Never for 1.3.0."
        required: false
        default: ""
      prerelease:
        description: "Publish as a prerelease (a train before the owner's smoke); latest stays the previous release"
        type: boolean
        required: false
        default: false
      promote:
        description: "No build: make the published prerelease of this tag the latest release. Not with prerelease."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  main-only:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything but main
        # `main` is the release branch (CLAUDE.md, Releasing). A release cut from
        # a working branch tags a commit `main` may never contain, and the next
        # release from `main` quietly drops whatever that one shipped.
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "releases are cut from main; this was dispatched on ${GITHUB_REF}" >&2
            exit 1
          fi
      - name: Refuse prerelease and promote together
        # One publishes a new release, the other edits one that is there; a
        # dispatch asking for both has not said which it meant.
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          PROMOTE: ${{ inputs.promote }}
        run: |
          if [ "$PRERELEASE" = "true" ] && [ "$PROMOTE" = "true" ]; then
            echo "prerelease and promote are exclusive: publish the prerelease first, promote it in a second run" >&2
            exit 1
          fi

  ci:
    needs: main-only
    if: ${{ !inputs.promote }}
    uses: ./.github/workflows/ci.yml

  local-gate:
    needs: main-only
    if: ${{ !inputs.promote }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # enforce mode reads the local-gate-waiver environment's reviewers; whether
      # this token may is to be seen on the first waiver, and when it may not,
      # the waiver is refused (verify-gate.mjs, rule 12).
      actions: read
    outputs:
      waived: ${{ steps.verify.outputs.waived }}
    steps:
      # The verifier reads the gated commit, the tags before this one and the
      # history of local-gate.json, so the whole history is fetched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Verify the local gate
        id: verify
        env:
          TAG: ${{ inputs.tag }}
          WAIVER: ${{ inputs.local_gate_waiver }}
          DRPG_GATE_KEY: ${{ secrets.DRPG_GATE_KEY }}
          DRPG_LOCAL_GATE: ${{ vars.DRPG_LOCAL_GATE }}
          DRPG_WAIVER_AUTHORS: ${{ vars.DRPG_WAIVER_AUTHORS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node audit/gate/verify-gate.mjs --tag "$TAG" --waiver "$WAIVER"

  waiver-approval:
    # Only in enforce mode, and only when the verifier accepted a waiver: the
    # run waits here for the owner's approval in the protected environment.
    needs: local-gate
    if: needs.local-gate.outputs.waived == 'true'
    runs-on: ubuntu-latest
    environment: local-gate-waiver
    steps:
      - name: The owner approved the waiver
        env:
          TAG: ${{ inputs.tag }}
        run: echo "local gate waiver for $TAG approved"

  release:
    needs: [ci, local-gate, waiver-approval]
    # Written out: without it a skipped waiver-approval would skip the release too.
    if: ${{ !cancelled() && !inputs.promote && needs.ci.result == 'success' && needs.local-gate.result == 'success' && (needs.waiver-approval.result == 'success' || needs.waiver-approval.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth 0: `stages.mjs check --release` checks that every earlier
      # shipped stage has its tag, and a shallow clone has none.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Check the tag, the stamps and the notes
        # module.json, the --drpg-css-version stamp (read back at load by
        # diagnostics.mjs to catch a stale CDN copy; the 1.2.42 package shipped
        # with it lagging), the six handbooks' headers and the README (all seven
        # said 1.2.55 under a 1.2.56 module: audit S14-16, S13-42, S12-76), and
        # the notes file this release publishes.
        env:
          TAG: ${{ inputs.tag }}
        run: node tools/check.mjs stamps notes --release "$TAG"

      - name: Check the stage ledger
        env:
          TAG: ${{ inputs.tag }}
        run: node tools/stages.mjs check --release "$TAG"

      - name: Build the package
        run: git archive --format=zip -o module.zip HEAD

      - name: Point the published manifest at this release's own zip
        # Only the copy uploaded next to the zip changes; the zip itself carries
        # the committed module.json, whose `latest` URLs are what an install and
        # the update check should read.
        run: |
          python3 - "${{ inputs.tag }}" "${{ github.repository }}" <<'PY'
          import json, sys
          tag, repo = sys.argv[1], sys.argv[2]
          with open("module.json", encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["download"] = f"https://github.com/{repo}/releases/download/{tag}/module.zip"
          with open("module.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print("download ->", manifest["download"])
          PY

      - name: Read what latest resolves to now
        # Only a prerelease's check reads it: latest is to stay this tag. Empty
        # when there is no release yet or the line is not there, and the check
        # then says it could not tell.
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(gh release view -R "${{ github.repository }}" 2>/dev/null | sed -n 's/^tag:[[:space:]]*//p' | head -1 || true)"
          echo "latest before this run: ${prev:-unknown}"
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          title="${TITLE:-${{ inputs.tag }}}"
          if [ "$PRERELEASE" = "true" ]; then which=--prerelease; else which=--latest; fi
          gh release create "${{ inputs.tag }}" module.zip module.json \
            -R "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$title" \
            --notes-file ".github/release-notes/${{ inputs.tag }}.md" \
            "$which"

      - name: Show what latest resolves to
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          PREV: ${{ steps.before.outputs.tag }}
        # No --json: the runner's gh does not know every field name, and a
        # verification step that can fail on a field name fails the whole run
        # AFTER the release is already out - which is exactly what happened on
        # run 1. Plain view cannot. A mismatch is printed as a warning rather than
        # failing, for the same reason: the release exists by now, and what is
        # wanted is somebody looking at it (a new prerelease can move `latest`).
        # A prerelease expects the latest read before it, and a warning names the
        # tag it wanted.
        run: |
          view="$(gh release view -R "${{ github.repository }}" | head -5)"
          echo "$view"
          if [ "$PRERELEASE" = "true" ]; then want="$PREV"; else want="${{ inputs.tag }}"; fi
          if [ -z "$want" ]; then
            echo "::warning::latest could not be read before the prerelease, so whether it stayed is not checked - check the Releases page"
          elif ! printf '%s\n' "$view" | grep -qF "$want"; then
            echo "::warning::releases/latest does not resolve to $want - check the Releases page"
          fi

  promote:
    # The owner's smoke passed: the prerelease this tag published becomes the
    # latest release. Nothing is built, uploaded or deleted.
    needs: main-only
    if: ${{ inputs.promote }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "promote: '$TAG' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          # Not piped: a step with no `shell:` runs `bash -e` (GitHub's docs), with no pipefail, so a pipe would hide gh's exit.
          view="$(gh release view "$TAG" -R "$REPO")" || { echo "promote: there is no release $TAG to promote" >&2; exit 1; }
          view="$(printf '%s\n' "$view" | head -5)"
          echo "$view"
          if ! printf '%s\n' "$view" | grep -qxE 'prerelease:[[:space:]]+true'; then
            echo "promote: $TAG is not a prerelease (or its view has no 'prerelease:' line), so it is left as it is" >&2
            exit 1
          fi
          gh release edit "$TAG" -R "$REPO" --prerelease=false --latest

      - name: Show what latest resolves to
        # The same check as the release job's, expecting the tag; a warning,
        # because the edit is made by now.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          view="$(gh release view -R "${{ github.repository }}" | head -5)"
          echo "$view"
          if ! printf '%s\n' "$view" | grep -qF "$TAG"; then
            echo "::warning::releases/latest does not resolve to $TAG - check the Releases page"
          fi
