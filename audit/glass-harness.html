<!-- THE CURTAIN WITHOUT FOUNDRY.
     Serve the repository root (python3 -m http.server 8765) and open this file: it mounts
     scripts/glass.mjs on the module's own markup with Foundry's globals stubbed, so the glass,
     its pulse, the pinned right column and the self-check can be looked at and measured in a
     browser with nothing else installed. Not part of the package (audit/ is export-ignored). -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/styles/motion.css"><link rel="stylesheet" href="/styles/danganronpa.css"><link rel="stylesheet" href="/styles/stained-glass.css"><link rel="stylesheet" href="/styles/pixel-icons.css">
<style>
  html,body{margin:0;background:#2a2430;min-height:100vh;overflow:hidden}
  body{background-image:linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:52px 52px}
  #interface{position:absolute;inset:0}
  #ui-left-column-1{position:absolute;left:16px;top:22px;width:312px}
  #ui-top{position:absolute;left:50%;transform:translateX(-50%);top:22px}
  #ui-right{position:absolute;right:0;top:22px;bottom:0;display:flex;flex-direction:row;align-items:flex-start}
  #ui-right-column-1{display:flex;flex-direction:column;gap:4px;margin-right:22px;transition:none}
  #sidebar{display:flex;flex-direction:row;height:100%}
  #sidebar-content{width:0;overflow:hidden;background:rgba(30,20,40,.9);transition:width .3s}
  #sidebar.expanded #sidebar-content{width:300px}
  #sidebar-tabs{width:48px;display:flex;flex-direction:column;gap:6px;padding:4px}
  #sidebar-tabs button,#scene-controls button{width:36px;height:36px;display:block}
  #scene-controls{position:absolute;left:20px;top:214px;display:grid;grid-template-columns:36px 36px;gap:6px}
  #drpg-messenger-launcher,#drpg-sound-launcher{position:fixed;right:22px;width:52px;height:52px;border-radius:50%}
  #drpg-sound-launcher{bottom:22px}#drpg-messenger-launcher{bottom:82px;width:66px;height:66px}
</style></head>
<body class="drpg-theme-stained-glass drpg-gm" data-drpg-time="afternoon" data-drpg-phase="dailyLife">
<div id="interface">
<div id="ui-left-column-1">
  <div id="drpg-hud"><div class="drpg-hud-ticker" aria-hidden="true"><span>Daily Life · Daily Life · Daily Life · </span><span>Daily Life · Daily Life · Daily Life · </span></div>
    <div class="drpg-hud-campaign">DanganRPG: Safe Havens Bleed</div><div class="drpg-hud-chapter">Chapter 1 · Day 3</div>
    <div class="drpg-hud-phase"><span class="drpg-hud-phase-glyph drpg-pxi"></span>Daily Life</div>
    <div class="drpg-hud-time-row"><button class="drpg-hud-button">&lt;</button><div class="drpg-hud-time-slot"><div class="drpg-hud-time">Afternoon</div></div><button class="drpg-hud-button">&gt;</button></div>
    <div class="drpg-hud-elapsed">43 min in</div><div class="drpg-hud-room">Dorm · no available project</div></div>
  <button id="drpg-gm-launcher">GM</button>
</div>
<div id="ui-top"><div id="drpg-despair">
  <div class="drpg-despair-row"><span class="drpg-despair-name">Monokuma</span><div class="drpg-despair-pips"></div><span class="drpg-despair-count">5/12</span></div>
  <div class="drpg-despair-row"><span class="drpg-despair-name">Monominie</span><div class="drpg-despair-pips"></div><span class="drpg-despair-count">0/12</span></div>
  <div class="drpg-despair-overflow">Despair overflow · 0/20</div></div></div>
<div id="ui-right">
  <div id="ui-right-column-1">
    <div id="drpg-player-status"><div class="drpg-status-field"><span class="drpg-status-label">Still to act</span><span class="drpg-status-value">4 / 4</span></div></div>
    <div id="countdowns"><div class="countdowns-header"><span class="window-title">Projects</span></div><div class="countdown-container"><span>Rig the dumbwaiter</span> 2/4</div></div>
  </div>
  <div id="sidebar"><div id="sidebar-content"></div><nav id="sidebar-tabs"><button class="ui-control"></button><button class="ui-control"></button><button class="ui-control"></button><button class="ui-control"></button></nav></div>
</div>
<div id="scene-controls"><button class="ui-control"></button><button class="ui-control"></button><button class="ui-control"></button><button class="ui-control"></button></div>
</div>
<button id="drpg-messenger-launcher"></button><button id="drpg-sound-launcher"></button>
<script type="module">
  for (const row of document.querySelectorAll(".drpg-despair-pips")) for (let i = 0; i < 12; i++) { const p = document.createElement("span"); p.className = "drpg-despair-pip" + (i < 5 ? " filled" : ""); row.append(p); }
  const defaults = { theme: "stainedGlass", glassEffects: true, glassPulse: true, reducedMotion: false, hudTicker: true, uiScale: 1, debug: false, pixelFont: true };
  globalThis.Hooks = { on() {}, once() {}, callAll() {} };
  globalThis.game = { ready: true, i18n: { localize: k => k.split(".").pop(), format: (k, d) => k }, settings: { get: (m, k) => defaults[k], settings: new Map() }, user: { isGM: true } };
  globalThis.ui = { sidebar: {} }; globalThis.foundry = { utils: { escapeHTML: s => s } }; globalThis.CONFIG = {};
  const m = await import("/scripts/glass.mjs");
  window.__glass = m;
  m.registerGlass();
</script></body></html>
