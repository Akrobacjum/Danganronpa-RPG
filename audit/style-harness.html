<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danganronpa RPG - the style harness</title>
<!-- THE STYLE HARNESS (E44 C1d, 04.11.2026). The module's windows as probe 08 captured them
     (audit/harness/probes/08-capture-windows.mjs, audit/windows/), under the module's sheets, outside Foundry: what
     audit/style-sweep.mjs reads `styleSnapshot` on in Chromium, and what E44's mockup round screenshots as "today".
     Served from the repository's root (`python3 -m http.server 8765`, then /audit/style-harness.html):
       ?w=<id>          one window of audit/windows/manifest.json; with none, every captured window in a column
       ?theme=legacy    Monokuma Legacy (the body's class and the pixel font, as glass-harness.html swaps them)
       ?role=player     a player's page (`drpg-player` on the body), for the windows a player opens
       ?kit=1           THE KIT GALLERY (E44 C3a): every component of scripts/ui-kit.mjs in each of its states, drawn by
                        the kit's own `drpgWindow` and builders (a DialogV2 stood in for below, as the harness's draws
                        one; its render hands the window to the kit, which dresses it), its words from lang/en.json
                        (`&lang=pl`: lang/pl.json); the kit card's "today" for E44's mockup round, and a page of the
                        style sweep's baseline. The captions over each window are this page's, not the module's
       ?sheet=1         THE SHEET STAND-IN (E21 C1c): the character sheet's frame at the size settings.mjs `scaleWindow`
                        gives it on this screen (its numbers through the exported, pure `sheetBox`), with the Stop as
                        sheet.mjs `injectSafeword` draws it (the default word), under the module's sheets. Daggerheart's
                        sheet itself is drawn neither headless nor here: the frame, its content box and the Stop are.
       ?fit=1           THE PLACEMENT (E21 C1c, for `style-sweep.mjs --fit`): each window stands where Foundry puts a new
                        one - fixed, centred, its top max(0, (vh - h) / 2), a model of `_updatePosition` (LIVE-E21-01) -
                        and `window.drpgFit()` reads each window in each tab state: placed with its first tab, then the
                        tab pressed through the kit's own `wireKitTabs` (which clamps the top here, `keepInScreen`, as no
                        application is there to ask). `drpgFit({ byHand: true })` switches the panes without the kit's
                        code: the sweep's control (c), the reposition skipped
     THE SHEETS ARE module.json's, in its order, read when the page loads (a synchronous request and a link written
     for each, so they block the first paint as written links do), so a sheet added to module.json is never missed
     here. WHAT THIS PAGE IS NOT: Foundry's frame (the harness's DialogV2 draws its form with no header, so the
     header here is this page's, written as Foundry writes one: `header.window-header` with `h1.window-title`),
     Foundry's own stylesheet, or a window's live data (the harness's seeded world). Each window stands in the page's
     flow (`position: relative`, the place the harness wrote inline taken off) at the width it was given, on the glass
     harness's ground, so a screenshot can take it alone. -->
<script>
  (function () {
    var req = new XMLHttpRequest();
    req.open("GET", "/module.json", false);
    req.send();
    var styles = JSON.parse(req.responseText).styles || [];
    for (var i = 0; i < styles.length; i++) document.write('<link rel="stylesheet" href="/' + styles[i] + '">');
  })();
</script>
<style>
  html, body.drpg-style-harness { background: #2a2430; }
  body.drpg-style-harness { display: block; overflow: auto; padding: 16px; margin: 0; min-height: 100vh; box-sizing: border-box; }
  .drpg-style-harness .drpg-style-shot { display: block; padding: 8px; }
  .drpg-style-harness .drpg-style-shot > .application { position: relative; left: auto; top: auto; max-width: 100%; }
  .drpg-style-harness .drpg-style-missing { font: 14px monospace; }
  .drpg-style-harness .drpg-style-kit { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
  .drpg-style-harness .drpg-style-caption { font: 12px/1.3 monospace; color: #e4ded8; margin: 0 0 4px; max-width: 520px; }
  /* ?fit=1: the windows where Foundry places them, not in the page's flow; the page itself does not scroll */
  body.drpg-style-harness.drpg-style-fit { overflow: hidden; padding: 0; height: 100vh; }
  .drpg-style-fit .drpg-style-shot { padding: 0; }
  .drpg-style-fit .drpg-style-shot > .application { position: fixed; margin: 0; max-width: none; }
  .drpg-style-fit .drpg-style-caption { display: none; }
</style>
</head>
<body class="drpg-theme-stained-glass drpg-gm drpg-style-harness" data-drpg-time="afternoon" data-drpg-phase="dailyLife">
<script>
  /* Set first, so the sweep waits for the module script below to finish (style-sweep.mjs `load`): the gallery's, or
     the captured windows' tab fit (E44 C4a). */
  document.body.setAttribute("data-drpg-kit-pending", "");
</script>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.get("theme") === "legacy") { document.body.classList.replace("drpg-theme-stained-glass", "drpg-theme-monokuma-legacy"); document.body.classList.add("drpg-pixel-font"); }
    if (q.get("role") === "player") document.body.classList.replace("drpg-gm", "drpg-player");
    if (q.get("fit")) document.body.classList.add("drpg-style-fit");
    var get = function (path) {
      var req = new XMLHttpRequest();
      req.open("GET", path, false);
      req.send();
      return req.status === 200 ? req.responseText : null;
    };
    var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]; }); };
    var manifest = JSON.parse(get("/audit/windows/manifest.json") || "{\"windows\": []}");
    if (q.get("kit") || q.get("sheet")) return;
    var wanted = q.get("w");
    var rows = manifest.windows.filter(function (r) { return r.captured && (!wanted || r.id === wanted); });
    if (wanted && !rows.length) document.write('<p class="drpg-style-missing">no captured window "' + esc(wanted) + '" in audit/windows/manifest.json</p>');
    rows.forEach(function (r) {
      var html = get("/audit/windows/" + r.file);
      if (html === null) { document.write('<p class="drpg-style-missing">audit/windows/' + esc(r.file) + ' did not load</p>'); return; }
      var holder = document.createElement("div");
      holder.innerHTML = html.trim();
      var app = holder.firstElementChild;
      /* A window on the kit's frame (ui-kit.mjs DrpgApp: `drpg-ui`, no `dialog`, the notice history since E44 C5; and
         drpgWindow's DialogV2, `drpg-ui` with `dialog`, since E21 C2a moved the first of them) is framed here as Foundry
         frames a window - its parts inside `section.window-content` - since the harness draws them straight into the
         window, and the kit's frame rules name that section (the kit gallery's DialogV2 stand-in draws it too). A window
         not on the kit is left as captured, so the style sweep reads it as before. */
      if (app.classList.contains("drpg-ui") && !app.querySelector(":scope > .window-content")) {
        var section = document.createElement("section");
        section.className = "window-content";
        while (app.firstChild) section.appendChild(app.firstChild);
        app.appendChild(section);
      }
      var header = '<header class="window-header"><h1 class="window-title">' + esc(r.title) + '</h1><button type="button" class="header-control" data-action="close">x</button></header>';
      app.insertAdjacentHTML("afterbegin", header);
      /* The harness's setPosition wrote the window's place inline (left, top, its height); the page lays it in its flow. */
      ["left", "top", "height", "position", "z-index"].forEach(function (p) { app.style.removeProperty(p); });
      if (typeof r.width === "number") app.style.width = r.width + "px";
      document.write('<div class="drpg-style-shot" id="shot-' + esc(r.id) + '" data-window="' + esc(r.id) + '">' + app.outerHTML + '</div>');
    });
  })();
</script>
<script type="module">
  /* THE KIT GALLERY (`?kit=1`). The kit's own code, outside Foundry: `game.i18n` reads the page's lang file, and
     `foundry.applications.api.DialogV2.wait` draws a window as the harness's DialogV2 draws one (a form of the
     content and a footer of submit buttons, each `class` and the default's `autofocus` as Foundry renders them),
     then hands it to the config's render, where drpgWindow dresses it - so what is shot is what the kit does. */
  const q = new URLSearchParams(location.search);
  /* What the module's files reach for when they load (the kit's imports, settings.mjs for `sheetBox`): a hook
     registry, as glass-harness.html stands one in, and settings that read nothing. */
  const standIns = () => {
    const hooks = new Map();
    globalThis.Hooks ??= { on(name, fn) { if (!hooks.has(name)) hooks.set(name, []); hooks.get(name).push(fn); return fn; },
      once(name, fn) { return this.on(name, fn); }, off() {}, callAll() { return true; } };
    globalThis.ui ??= {};
    globalThis.CONFIG ??= {};
    globalThis.game ??= { ready: true, user: { isGM: !document.body.classList.contains("drpg-player") }, settings: { get: () => undefined, settings: new Map() },
      i18n: { localize: key => key, has: () => false, format: key => key } };
    globalThis.foundry ??= { utils: { escapeHTML: v => String(v ?? ""), randomID: () => Math.random().toString(36).slice(2, 10), deepClone: o => structuredClone(o) }, applications: { api: {} } };
  };
  /* THE PLACEMENT AND THE READING (`?fit=1`; E21 C1c). Each window is put where Foundry puts a new one; each state is
     read as rectangles against the viewport: the window, its footer and each shown button of it, the tab bar, and every
     element inside it that scrolls (its content taller or wider than its box, its overflow auto or scroll). */
  const place = win => {
    const r = win.getBoundingClientRect();
    win.style.left = `${Math.max(0, Math.round((innerWidth - r.width) / 2))}px`;
    win.style.top = `${Math.max(0, Math.round((innerHeight - r.height) / 2))}px`;
  };
  const box = el => { const r = el.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.right), Math.round(r.bottom)]; };
  const inView = el => { const r = el.getBoundingClientRect(); return r.left >= -0.5 && r.top >= -0.5 && r.right <= innerWidth + 0.5 && r.bottom <= innerHeight + 0.5; };
  const shown = el => { const r = el.getBoundingClientRect(); return !el.hidden && r.width > 0 && r.height > 0; };
  /* The Stop in view (E21 C5a): its rectangle in the viewport AND inside the sheet's content box, which clips what
     stands below its foot - a Stop under the box's edge is not seen, wherever the viewport ends. */
  const stopShown = win => {
    const stop = win.querySelector(".drpg-safeword-button");
    const box = (win.querySelector(".window-content") ?? win).getBoundingClientRect(), r = stop.getBoundingClientRect();
    return inView(stop) && r.top >= box.top - 0.5 && r.bottom <= box.bottom + 0.5 && r.left >= box.left - 0.5 && r.right <= box.right + 0.5;
  };
  const reading = (win, tab) => {
    const footer = win.querySelector("footer.form-footer");
    const nav = win.querySelector("nav.drpg-tabs");
    /* A field scrolls its own value (E21 C2a: the case dashboard's one-line Key descriptions, `rows="1"`, under Legacy):
       that is the field, not a second region of the window, so a text field or a list is not counted. */
    const scrollers = [win, ...win.querySelectorAll("*")].filter(el => {
      if (el.matches("textarea, select, input")) return false;
      const cs = getComputedStyle(el);
      const y = /auto|scroll/.test(cs.overflowY) && el.scrollHeight > el.clientHeight + 1;
      const x = /auto|scroll/.test(cs.overflowX) && el.scrollWidth > el.clientWidth + 1;
      return (y || x) && shown(el);
    }).map(el => (el.classList.contains("drpg-kit-body") ? "kit-body" : `${el.localName}.${[...el.classList].slice(0, 3).join(".")}`));
    return {
      tab, box: box(win), window: inView(win),
      footer: footer ? inView(footer) : null,
      buttonsOut: footer ? [...footer.querySelectorAll("button")].filter(shown).filter(b => !inView(b)).map(b => b.dataset.action ?? b.textContent.trim()) : [],
      tabs: nav ? inView(nav) : null,
      // the kit's body taller than its box with nothing to scroll it: what it holds is cut off (the sweep's control b)
      cut: (() => { const b = win.querySelector(".drpg-kit-body"); return Boolean(b && b.scrollHeight > b.clientHeight + 1 && !/auto|scroll/.test(getComputedStyle(b).overflowY)); })(),
      scrollers
    };
  };
  const switchByHand = (win, key) => {
    for (const t of win.querySelectorAll('nav.drpg-tabs > button[role="tab"]')) t.setAttribute("aria-selected", String(t.dataset.drpgTabKey === key));
    for (const p of win.querySelectorAll("[data-drpg-pane]")) p.hidden = p.dataset.drpgPane !== key;
  };
  window.drpgFit = async ({ byHand = false, only = null } = {}) => {
    const frame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const out = [];
    for (const shot of document.querySelectorAll(".drpg-style-shot")) {
      const win = shot.querySelector(":scope > .application");
      if (!win || (only && shot.dataset.window !== only)) continue;
      const kit = win.classList.contains("drpg-ui");
      const keys = [...win.querySelectorAll('nav.drpg-tabs > button[role="tab"]')].map(t => t.dataset.drpgTabKey);
      const press = key => {
        const t = win.querySelector(`nav.drpg-tabs > button[data-drpg-tab-key="${CSS.escape(key)}"]`);
        if (byHand) switchByHand(win, key); else t?.click();
      };
      const states = [];
      if (keys.length) press(keys[0]);
      place(win);
      await frame();
      states.push(reading(win, keys[0] ?? null));
      for (const key of keys.slice(1)) {
        // opened on its first tab, where Foundry put it, and then this tab pressed
        if (byHand) switchByHand(win, keys[0]); else press(keys[0]);
        await frame();
        place(win);
        await frame();
        press(key);
        await frame();
        states.push(reading(win, key));
      }
      if (keys.length) { press(keys[0]); await frame(); place(win); }
      out.push({ window: shot.dataset.window, kit, title: win.querySelector(".window-title")?.textContent ?? null, states,
        stop: win.querySelector(".drpg-safeword-button") ? stopShown(win) : null });
    }
    return out;
  };
  if (q.get("sheet")) {
    /* THE SHEET STAND-IN (`?sheet=1`, E21 C1c). The frame Daggerheart's sheet stands in (the classes the module's rules
       name it by), at `sheetBox`'s size for this screen and theme, its content a column as tall as a sheet's tabs, and
       the Stop as `injectSafeword` draws it, appended to `.window-content`. */
    standIns();
    try {
      const { sheetBox } = await import("/scripts/settings.mjs");
      const theme = document.body.classList.contains("drpg-theme-stained-glass") ? "glass" : "legacy";
      const size = sheetBox(innerWidth, innerHeight, 1, theme);
      const shot = document.createElement("div");
      shot.className = "drpg-style-shot";
      shot.id = "shot-sheet";
      shot.dataset.window = "sheet";
      const app = document.createElement("div");
      app.className = "application sheet daggerheart actor character";
      app.style.width = `${size.width}px`;
      app.style.height = `${size.height}px`;
      /* Foundry's frame (E21 C5a): the window a flex column, its content box the rest of it under the title bar,
         whatever the bar's height - the glass's bar is 60 px, and a content box 32 px short of the window overran it. */
      app.style.display = "flex";
      app.style.flexDirection = "column";
      app.innerHTML = `<header class="window-header"><h1 class="window-title">Character sheet (stand-in)</h1><button type="button" class="header-control" data-action="close">x</button></header>`
        + `<section class="window-content" style="flex: 1 1 auto; min-height: 0; overflow: hidden"><div class="drpg-style-sheet-body" style="height: 100%; overflow: auto"><div style="height: 1400px"></div></div></section>`;
      const stop = document.createElement("button");
      stop.type = "button";
      stop.className = "drpg-safeword-button";
      stop.innerHTML = `<i class="fa-solid fa-hand" inert></i>\n        <span>Safe Word</span>`;
      app.querySelector(".window-content").append(stop);
      shot.append(app);
      document.body.append(shot);
      document.body.dataset.drpgSheetBox = `${size.width}x${size.height}`;
    } finally {
      document.body.removeAttribute("data-drpg-kit-pending");
    }
  } else if (q.get("kit")) {
    const get = path => { const req = new XMLHttpRequest(); req.open("GET", path, false); req.send(); return req.status === 200 ? req.responseText : null; };
    const lang = JSON.parse(get(`/lang/${q.get("lang") === "pl" ? "pl" : "en"}.json`) || "{}");
    const at = key => key.split(".").reduce((o, k) => o?.[k], lang);
    const localize = key => (typeof at(key) === "string" ? at(key) : key);
    const escapeHTML = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#x27;" }[c]));
    const grid = document.createElement("div");
    grid.className = "drpg-style-kit";
    document.body.append(grid);
    let shot = null;
    /* What the kit's imports (utils.mjs, live.mjs and theirs) reach for when they load: a hook registry, as
       glass-harness.html stands one in, and the settings read nothing. */
    const hooks = new Map();
    globalThis.Hooks = { on(name, fn) { if (!hooks.has(name)) hooks.set(name, []); hooks.get(name).push(fn); return fn; },
      once(name, fn) { return this.on(name, fn); }, off(name, fn) { hooks.set(name, (hooks.get(name) ?? []).filter(f => f !== fn)); },
      callAll(name, ...a) { for (const fn of hooks.get(name) ?? []) fn(...a); return true; } };
    globalThis.ui = {};
    globalThis.CONFIG = {};
    globalThis.game = { ready: true, user: { isGM: !document.body.classList.contains("drpg-player") }, settings: { get: () => undefined, settings: new Map() },
      i18n: { localize, has: key => typeof at(key) === "string", format: (key, data) => localize(key).replace(/\{(\w+)\}/g, (m, k) => (k in (data ?? {}) ? String(data[k]) : m)) } };
    globalThis.foundry = { utils: { escapeHTML, randomID: () => Math.random().toString(36).slice(2, 10), deepClone: o => structuredClone(o) }, applications: { api: { DialogV2: { wait(config) {
      const root = document.createElement("div");
      root.className = ["application", "dialog", ...(config.classes ?? [])].join(" ");
      if (config.position?.width) root.style.width = `${config.position.width}px`;
      root.innerHTML = `<header class="window-header"><h1 class="window-title">${escapeHTML(config.window?.title)}</h1><button type="button" class="header-control" data-action="close">x</button></header>`
        + `<section class="window-content"><form class="dialog-form standard-form"><div class="dialog-content standard-form"></div><footer class="form-footer"></footer></form></section>`;
      root.querySelector(".dialog-content").append(...config.content.childNodes);
      const foot = root.querySelector("footer");
      for (const b of config.buttons ?? []) {
        foot.insertAdjacentHTML("beforeend", `<button type="submit" data-action="${escapeHTML(b.action)}" class="${b.default ? "default " : ""}${escapeHTML(b.class ?? "")}"${b.default ? " autofocus" : ""}><span>${escapeHTML(b.label)}</span></button>`);
      }
      shot.append(root);
      config.render?.(new Event("render"), { element: root, addEventListener() {} });
      return new Promise(() => {});
    } } } } };
    const K = await import("/scripts/ui-kit.mjs");
    const L = localize;
    const frame = (id, caption, options) => {
      shot = document.createElement("div");
      shot.className = "drpg-style-shot";
      shot.id = `shot-kit-${id}`;
      shot.dataset.window = `kit-${id}`;
      shot.insertAdjacentHTML("afterbegin", `<p class="drpg-style-caption">${escapeHTML(caption)}</p>`);
      grid.append(shot);
      // The gallery's `width` is DialogV2's opening width, as before E21 W1 gave drpgWindow a `width` of its own.
      const { width = 380, ...rest } = options;
      K.drpgWindow({ classes: [`drpg-window-kit-${id}`], position: { width }, ...rest });
    };
    const rooms = ["Cafeteria", "Dorm A", "Dorm B", "Gym", "Hall", "Storage", "Library", "Garden", "Pool", "Lab", "Art room", "Music room"];
    const columns = [{ key: "room", label: "Room" }, { key: "n", label: "N", num: true }, { key: "act", label: "", act: true }];
    const row = (name, i) => ({ room: escapeHTML(name), n: String(i + 1), act: `<button type="button" class="drpg-mini-button">${escapeHTML(L("DRPG.Kit.close"))}</button>` });
    frame("tabs", "kitTabs: three panes, the second open; the footer follows the tab", {
      title: "kitTabs", width: 480,
      tabs: { active: "two", sections: [{ key: "one", label: "Bedrooms", html: K.helpText("DRPG.Kit.scrollMore") }, { key: "two", label: "Doors", html: K.helpText("DRPG.Kit.tableEmpty") },
        { key: "three", label: "Description", html: "<p>-</p>" }], buttons: { one: ["save"], two: ["save"], three: [] }, always: ["close"] },
      footer: { primary: { action: "save", label: "Save" }, close: "close" }
    });
    frame("footer", "the footer: every role (the closing word, a secondary, a destructive one; the GM's road, the primary)", {
      title: "footer", width: 560, body: K.helpText("DRPG.Kit.scrollMore"),
      footer: { primary: { action: "save", label: "Save" }, gmRoute: [{ action: "ask", label: "Ask the GM" }], secondary: [{ action: "split", label: "Split evenly" }],
        destructive: [{ action: "wipe", label: "Reveal" }], close: "close" }
    });
    const fields = [{ label: "Campaign name", id: "kit-name", field: "<input type=\"text\" id=\"kit-name\" value=\"DRPG Audit World\">" },
      { label: "Day", id: "kit-day", field: K.stepper({ name: "day", value: 1, min: 1, id: "kit-day" }) },
      { label: "Phase", id: "kit-phase", field: `<select id="kit-phase">${K.emptyOption("DRPG.Assign.nobody")}<option>Daily Life</option></select>` },
      { full: K.helpText("DRPG.Kit.scrollMore") }];
    frame("form-wide", "formGrid, wide: a label column and a field column", { title: "formGrid", width: 520, body: K.formGrid(fields), footer: { close: "cancel" } });
    frame("form-narrow", "formGrid, narrow: one column under the container's 30rem", { title: "formGrid", width: 300, body: K.formGrid(fields), footer: { close: "cancel" } });
    frame("table-empty", "dataTable, empty", { title: "dataTable", body: K.dataTable({ columns, rows: [] }), footer: { close: "close" } });
    frame("table-short", "dataTable, three rows", { title: "dataTable", body: K.dataTable({ columns, rows: rooms.slice(0, 3).map(row) }), footer: { close: "close" } });
    frame("table-scroll", "dataTable, more rows than the window: the body scrolls, its head sticks, the signal shows", {
      title: "dataTable", footer: { close: "close" },
      body: K.dataTable({ columns, rows: [...rooms, ...rooms].map(row) }).replace("<div class=\"drpg-data-table-box\">", "<div class=\"drpg-data-table-box\" style=\"max-height: 220px; overflow: auto\">")
    });
    frame("controls", "stepper at its min, mid and out of range; toggle on, off and disabled", {
      title: "controls", width: 420,
      body: K.stepper({ name: "a", value: 0, min: 0, max: 60, label: "Threshold (X)" }) + K.stepper({ name: "b", value: 20, min: 0, max: 60, label: "Threshold (X)" })
        + K.stepper({ name: "c", value: 61, min: 0, max: 60, label: "Threshold (X)" }) + K.stepper({ name: "d", value: 10, min: 0, max: 50, step: 10, label: "Debate length" })
        + K.toggle({ name: "t1", checked: true, label: "Indirect murder" }) + K.toggle({ name: "t2", label: "Indirect murder" }) + K.toggle({ name: "t3", disabled: true, label: "Indirect murder" }),
      footer: { close: "close" }
    });
    frame("chips", "chips: pressed, with a count, disabled", {
      title: "chips", width: 420,
      body: K.chips([{ label: "All", pressed: true, count: 6 }, { label: "For you", count: 2 }, { label: "From players", count: 0, disabled: true }, { label: "Evidence", count: 1 }]),
      footer: { close: "close" }
    });
    frame("boxes", "the three boxes and the help line", {
      title: "boxes", width: 420,
      body: K.box("info", escapeHTML(L("DRPG.Kit.scrollMore"))) + K.box("warning", escapeHTML(L("DRPG.Kit.tableEmpty"))) + K.box("secret", escapeHTML(L("DRPG.Kit.scrollMore"))) + K.helpText("DRPG.Kit.tableEmpty"),
      footer: { close: "close" }
    });
    frame("modes", "modeBar: four modes, the third active", {
      title: "modeBar", width: 560,
      body: K.modeBar([{ key: "debate", label: "Open debate" }, { key: "testimony", label: "Testimony" }, { key: "panic", label: "Panic round" }, { key: "closing", label: "Closing argument" }], { active: "panic" }),
      footer: { close: "close" }
    });
    await document.fonts?.ready;
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    document.body.removeAttribute("data-drpg-kit-pending");
  } else {
    /* THE CAPTURED WINDOWS' TAB BARS (E44 C4a). A captured window is markup only, so nothing has run the kit's one-line
       fit on its bar (ui-kit.mjs `wireKitTabs` runs it in the module once the window is laid out). It is run here as
       the module runs it in a window the kit does not frame - `fitKitTabs(nav)`, no window to widen - once the faces
       have loaded, so a shot shows the bar a GM sees. What the kit's imports reach for when they load is stood in
       as the gallery stands it in, reading nothing. */
    const hooks = new Map();
    globalThis.Hooks ??= { on(name, fn) { if (!hooks.has(name)) hooks.set(name, []); hooks.get(name).push(fn); return fn; },
      once(name, fn) { return this.on(name, fn); }, off() {}, callAll() { return true; } };
    globalThis.ui ??= {};
    globalThis.CONFIG ??= {};
    globalThis.game ??= { ready: true, user: { isGM: !document.body.classList.contains("drpg-player") }, settings: { get: () => undefined, settings: new Map() },
      i18n: { localize: key => key, has: () => false, format: key => key } };
    globalThis.foundry ??= { utils: { escapeHTML: v => String(v ?? ""), randomID: () => Math.random().toString(36).slice(2, 10), deepClone: o => structuredClone(o) }, applications: { api: {} } };
    try {
      const K = await import("/scripts/ui-kit.mjs");
      await document.fonts?.ready;
      await new Promise(r => requestAnimationFrame(r));
      /* A window that states its width (E21 W1: `width`, ui-kit.mjs WINDOW_WIDTHS; `data-drpg-width` on the captured root)
         at the kit's own `kitWidth` on this page's screen, written inline as Foundry writes `position.width`; first, as
         the module opens it at that width (`position`) before its tabs fit and a `fit` measures. */
      for (const app of document.querySelectorAll(".drpg-style-shot > .application.drpg-kit-width[data-drpg-width]")) {
        const named = app.dataset.drpgWidth;
        const width = K.kitWidth(/^\d+$/.test(named) ? Number(named) : named);
        if (typeof width === "number") app.style.width = `${width}px`;
      }
      for (const nav of document.querySelectorAll(".drpg-style-shot nav.drpg-tabs")) K.fitKitTabs(nav);
      /* A `fit` window (E21 C2a: tableDialog's fifteen, `drpg-kit-fit`) as wide as its widest table, by the kit's own
         `fitKitWidth`, as the module runs it after the render; its `setPosition` is the width written inline, as Foundry
         writes it (a model: Foundry's own clamp is LIVE-E21-01's). Measured before the placement, as in the module. */
      for (const app of document.querySelectorAll(".drpg-style-shot > .application.drpg-kit-fit")) {
        K.fitKitWidth({ element: app, setPosition: ({ width }) => { if (typeof width === "number") app.style.width = `${width}px`; } });
      }
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => requestAnimationFrame(r))));
      /* ?fit=1 (E21 C1c): the tabs wired by the kit's own code, the window its `win`, so a press clamps its top
         (`keepInScreen`) as a press asks Foundry to (`setPosition`) in the module. */
      if (q.get("fit")) for (const app of document.querySelectorAll(".drpg-style-shot > .application")) K.wireKitTabs(app, { win: app, fit: false });
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    } finally {
      document.body.removeAttribute("data-drpg-kit-pending");
    }
  }
</script>
