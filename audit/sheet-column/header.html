<header class="character-header-sheet">
    <line-div></line-div>
    <div class="name-row">
        <h1
            class="actor-name input"
            contenteditable="plaintext-only"
            data-property="name"
            placeholder="Actor Name"
            autocomplete="off"
            spellcheck="false"
        >Aiko</h1>
        <div class='level-div'>
            <h3 class='label'>
                    Level
                    <input type="text" data-dtype="Number" class="level-value" value=1  />
            </h3>
        </div>
    </div>
    <div class="character-details">
        <div>
                    <span class="missing-header-feature" data-action="openPack" data-key="classes">Class</span>
            <span class="dot">•</span>
                    <span class="missing-header-feature" data-action="openPack" data-key="subclasses">Subclass</span>
            <span class="dot">•</span>
                    <span class="missing-header-feature" data-action="openPack" data-key="communities">Community</span>
            <span class="dot">•</span>
                    <span class="missing-header-feature" data-action="openPack" data-key="ancestries">Ancestry</span>
        </div>

    </div>

    <div class="character-row">
        <div class="resource-section">
            <div class="hope-section">
                <h4>Hope</h4>
                    <span class='hope-value' data-action='toggleHope' data-value="1">
                            <i class='fa-solid fa-diamond'></i>
                    </span>
                    <span class='hope-value' data-action='toggleHope' data-value="2">
                            <i class='fa-solid fa-diamond'></i>
                    </span>
                    <span class='hope-value' data-action='toggleHope' data-value="3">
                            <i class='fa-regular fa-circle'></i>
                    </span>
                    <span class='hope-value' data-action='toggleHope' data-value="4">
                            <i class='fa-regular fa-circle'></i>
                    </span>
                    <span class='hope-value' data-action='toggleHope' data-value="5">
                            <i class='fa-regular fa-circle'></i>
                    </span>
                    <span class='hope-value' data-action='toggleHope' data-value="6">
                            <i class='fa-regular fa-circle'></i>
                    </span>
                
            </div>
        </div>
        <div class="downtime-section">
                <button type="button" data-action="useDowntime" data-type="shortRest" data-tooltip="DAGGERHEART.APPLICATIONS.Downtime.shortRest.title">
                    <i class="fa-solid fa-fw fa-utensils"></i>
                </button>
                <button type="button" data-action="useDowntime" data-type="longRest" data-tooltip="DAGGERHEART.APPLICATIONS.Downtime.longRest.title">
                    <i class="fa-solid fa-fw fa-bed"></i>
                </button>
        </div>
    </div>
