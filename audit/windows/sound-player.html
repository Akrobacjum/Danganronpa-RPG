<dialog id="app-HmZtdfnH" class="application dialog drpg-panel drpg-projects drpg-sound drpg-sound-player drpg-window-sound drpg-ui drpg-kit-fit" open="" style="left: 282px; top: 384px;" data-drpg-scaled="1" lang="en" data-drpg-text-guard="1"><form class="dialog-form standard-form"><div class="dialog-content standard-form"><div class="drpg-kit-body"><fieldset class="drpg-sound-volumes">
        <legend>Volume</legend>
        
        <label class="drpg-sound-slider" data-drpg-slider="sound">
            <span class="drpg-sound-slider-name">Sound</span>
            <input type="range" min="0" max="100" step="1" name="vol:sound" value="100" data-drpg-named="own">
            <output>100%</output>
            <span class="notes">The sound effects - windows, chat, doors, the trial floor. Not the music.</span>
        </label>
        <label class="drpg-sound-slider" data-drpg-slider="music">
            <span class="drpg-sound-slider-name">Music</span>
            <input type="range" min="0" max="100" step="1" name="vol:music" value="100" data-drpg-named="own">
            <output>100%</output>
            <span class="notes">The playlists. Foundry's own playlist volume, not a second one beside it.</span>
        </label>
        <p class="notes">Both live in this browser only.</p>
        <label class="drpg-sound-switch">
            <input type="checkbox" name="messengerSound" checked="" data-drpg-named="own">
            <span>Messenger sounds</span>

    </fieldset></div></div><footer class="form-footer drpg-kit-footer"><div class="drpg-kit-right"></div><div class="drpg-kit-left"><button type="submit" data-action="close" class="default drpg-role-close" data-drpg-role="close" autofocus="" data-drpg-named="own">Close</button></div></footer></form></dialog>
